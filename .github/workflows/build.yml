name: Build Executable

on:
  push:
    branches: [ main, fix/template-sync-and-licensing ]
  pull_request:
    branches: [ main, fix/template-sync-and-licensing ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean up previous builds
      run: |
        if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
        if (Test-Path "build") { Remove-Item "build" -Recurse -Force }
        "BarcodePrinter.spec", "Updater.spec", "InstallationWizard.spec" | ForEach-Object { if (Test-Path $_) { Remove-Item $_ -Force } }

    - name: Get Version
      id: get_version
      run: |
        $version = (Get-Content version.py) -replace '__version__ = "', '' -replace '".*$', ''
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Build Barcode Printer
      run: |
        pyinstaller --noconfirm --onefile --console --name "BarcodePrinter" --icon=images/logo.ico --version-file=file_version_info.txt --add-data "modules;modules" --add-data "ui;ui" --add-data "images;images" --add-data "lib;lib" --add-binary "libusb-1.0.dll;." --hidden-import=win32print --hidden-import=pyodbc --hidden-import=PyQt5 --hidden-import=libusb --hidden-import=usb --hidden-import=pyusb main.py

    - name: Build Updater
      # --uac-admin: this writes into C:\barcode (a system-drive-root folder
      # regular processes can't write to without elevation), so it needs to
      # request Administrator rights at launch via an embedded manifest.
      run: |
        pyinstaller --noconfirm --onefile --console --uac-admin --name "Updater" --icon=images/logo.ico --version-file=file_version_info.txt --add-data "lib/updater;lib/updater" --add-data "images;images" --hidden-import=PyQt5 --hidden-import=requests lib/updater/Updater.py

    - name: Build Installation Wizard
      # --uac-admin: same reasoning as Updater above -- this is what
      # actually creates C:\barcode and writes BarcodePrinter.exe into it.
      run: |
        pyinstaller --noconfirm --onefile --console --uac-admin --name "InstallationWizard" --icon=images/logo.ico --version-file=file_version_info.txt --add-data "images;images" --hidden-import=PyQt5 --hidden-import=requests InstallationWizard.py

    - name: Copy DLL to dist
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item "libusb-1.0.dll" "dist\libusb-1.0.dll"

    - name: Add SignTool to PATH
      shell: pwsh
      run: |
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\*\bin\*\x64" -Filter "signtool.exe" -Recurse | Sort-Object -Descending LastWriteTime | Select-Object -First 1
        if ($signtool) {
            $signtoolDir = $signtool.DirectoryName
            echo "$signtoolDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Sign Executables
      shell: pwsh
      run: |
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Mozillio Team" -KeyUsage DigitalSignature -FriendlyName "Mozillio Code Signing" -CertStoreLocation "Cert:\CurrentUser\My"
        $password = ConvertTo-SecureString -String "Mozillio123!" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "mozillio_cert.pfx" -Password $password
        
        "BarcodePrinter.exe", "Updater.exe", "InstallationWizard.exe" | ForEach-Object {
          signtool sign /f mozillio_cert.pfx /p Mozillio123! /fd SHA256 /t http://timestamp.sectigo.com /v "dist\$_"
        }

    - name: Commit and Push Build Artifacts
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/template-sync-and-licensing')
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add dist/
        git diff --staged --quiet || git commit -m "ci: auto-commit build artifacts [skip ci]"
        git push

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/template-sync-and-licensing')
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}-${{ github.run_number }}
        name: Barcode Printer v${{ env.VERSION }} (Build ${{ github.run_number }})
        draft: false
        prerelease: false
        files: |
          dist/BarcodePrinter.exe
          dist/Updater.exe
          dist/InstallationWizard.exe
          dist/libusb-1.0.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload All Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BarcodePrinter-Build-Artifacts
        path: |
          dist/BarcodePrinter.exe
          dist/Updater.exe
          dist/InstallationWizard.exe
          dist/libusb-1.0.dll
